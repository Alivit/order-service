server:
  port: 8083
spring:
  datasource:
    url: ${DOCKER_DATABASE_URL}
    username: ${DOCKER_DB_USER}
    password: ${DOCKER_DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  grpc:
    client:
      channels:
        userServiceGrpc:
          address: 'static://user-service:9091'
          secure: false