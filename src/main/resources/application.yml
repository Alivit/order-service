spring:
  profiles:
    active: local
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${ORDER_DB_SCHEMA}
        default_batch_fetch_size: 20
    open-in-view: false
  liquibase:
    enabled: true
    change-log: db/changelog/changelog.yml
    default-schema: ${ORDER_DB_SCHEMA}
  data:
    web:
      pageable:
        serialization-mode: via_dto
